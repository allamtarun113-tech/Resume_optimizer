# Render Blueprint: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: resume-optimizer-api
    runtime: docker
    plan: free
    region: singapore
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: SUPABASE_URL
        value: https://toesvlmefyvghivevjie.supabase.co
      # JSON list, e.g. ["https://<app>.vercel.app","http://localhost:3000"]
      - key: ALLOWED_ORIGINS
        sync: false
