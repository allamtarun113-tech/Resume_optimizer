    name: resume-optimizer-api
    runtime: docker
    plan: free
    region: singapore
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: SUPABASE_URL
        value: https://toesvlmefyvghivevjie.supabase.co
      # Comma-separated list of frontend origins allowed to call the API.
      - key: ALLOWED_ORIGINS
        value: https://resume-optimizer-ten-virid.vercel.app,http://localhost:3000
