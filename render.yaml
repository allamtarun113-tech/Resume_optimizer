# Render Blueprint: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: resume-optimizer-api
    runtime: docker
    plan: free
    region: singapore
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: SUPABASE_URL
        value: https://toesvlmefyvghivevjie.supabase.co
      # Comma-separated list of frontend origins allowed to call the API.
      - key: ALLOWED_ORIGINS
        value: https://resume-optimizer-ten-virid.vercel.app,http://localhost:3000
      # Secrets and per-environment choices: set in the Render dashboard
      # (sync: false means the Blueprint never overwrites them).
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL_SMALL
        sync: false
      - key: OPENAI_MODEL_LARGE
        sync: false
