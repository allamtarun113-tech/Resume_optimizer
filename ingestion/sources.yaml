# Allow-listed public GitHub repos of interview questions (CLAUDE.md §6).
# Only permissive licenses (MIT, Apache-2.0, BSD, CC0-1.0, CC-BY-4.0, Unlicense), checked
# via the GitHub API when added. Fetched with the GitHub MCP server by
# `uv run python -m scripts.ingest_questions` (run in backend/). Only question text is
# stored, with its source and license; answers are never stored.
#
# Per source: category (technical | general), role_tags, and per-file default topics
# (taxonomy skill ids). Section headings and the question text add more topics.
# Order matters: when two sources have the same question, the earlier one is kept.

sources:
  # --- general / behavioral ---------------------------------------------------------
  - repo: yangshun/tech-interview-handbook
    ref: main
    license: MIT
    category: general
    role_tags: [all]
    files:
      - {path: apps/website/contents/behavioral-interview-questions.md, topics: []}

  - repo: DataTalksClub/data-analytics-interviews
    ref: main
    license: CC-BY-4.0
    category: general
    role_tags: [data]
    files:
      - {path: behavioral.md, topics: []}

  # --- frontend -------------------------------------------------------------------------
  - repo: h5bp/Front-end-Developer-Interview-Questions
    ref: main
    license: MIT
    category: technical
    role_tags: [frontend]
    files:
      - {path: src/questions/general-questions.md, topics: [frontend-development]}
      - {path: src/questions/html-questions.md, topics: [html]}
      - {path: src/questions/css-questions.md, topics: [css]}
      - {path: src/questions/javascript-questions.md, topics: [javascript]}
      - {path: src/questions/testing-questions.md, topics: [testing]}
      - {path: src/questions/performance-questions.md, topics: [web-performance]}
      - {path: src/questions/network-questions.md, topics: [http]}
      - {path: src/questions/coding-questions.md, topics: [javascript]}

  - repo: Chalarangelo/30-seconds-of-interviews
    ref: master
    license: MIT
    category: technical
    role_tags: [frontend]
    files:
      - {path: README.md, topics: [javascript]}

  - repo: sudheerj/reactjs-interview-questions
    ref: master
    license: MIT
    category: technical
    role_tags: [frontend]
    files:
      - {path: README.md, topics: [react]}

  # --- general software / backend (FAQGURU covers many stacks) -------------------------
