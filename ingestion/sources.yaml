      - {path: topics/en/javascript.md, topics: [javascript]}
      - {path: topics/en/typeScript.md, topics: [typescript]}
      - {path: topics/en/nodejs.md, topics: [nodejs]}
      - {path: topics/en/react.md, topics: [react]}
      - {path: topics/en/redux.md, topics: [redux]}
      - {path: topics/en/angular.md, topics: [angular]}
      - {path: topics/en/vuejs.md, topics: [vue]}
      - {path: topics/en/html5.md, topics: [html]}
      - {path: topics/en/css.md, topics: [css]}
      - {path: topics/en/sass.md, topics: [sass]}
      - {path: topics/en/bootstrap.md, topics: [bootstrap]}
      - {path: topics/en/webpack.md, topics: [webpack]}
      - {path: topics/en/graphql.md, topics: [graphql]}
      - {path: topics/en/golang.md, topics: [go]}
      - {path: topics/en/c.md, topics: [c]}
      - {path: topics/en/mongodb.md, topics: [mongodb]}
